
name: Build InkVoice AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: pip install pillow

      - name: Create Android launcher icons
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import xml.etree.ElementTree as ET

          logo = Path("file_00000000a35c8210afafa5f874356537.png")

          if not logo.exists():
              raise FileNotFoundError("InkVoice AI logo PNG was not found.")

          image = Image.open(logo).convert("RGBA")
          image = ImageOps.fit(image, (192, 192), method=Image.Resampling.LANCZOS)

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = Path("app/src/main/res") / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(folder / "ic_launcher.png")

          manifest = Path("app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise FileNotFoundError("AndroidManifest.xml was not found.")

          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"

          application = root.find("application")
          if application is None:
              raise ValueError("Application section was not found in manifest.")

          application.set(android + "icon", "@mipmap/ic_launcher")
          application.set(android + "roundIcon", "@mipmap/ic_launcher")

          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          print("InkVoice AI launcher icons created successfully.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InkVoice-AI-APK
          path: app/build/outputs/apk/debug/*.apk
