
name: Extract InkVoice AI Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          mkdir extracted
          unzip -o InkVoice-AI-Android-Source.zip -d extracted
          cp -R extracted/. .
          rm -rf extracted

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract InkVoice AI Android project" || echo "No changes to commit"
          git push
